
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # If DATABASE_URL is not set in .env, it will default to the local db container
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@db:5432/einfo}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: einfo
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
